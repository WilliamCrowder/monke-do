name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # The packager also creates the GitHub release with GITHUB_TOKEN, which new repositories
    # give read-only access by default.
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Interface 16001 makes the packager pick the "forever" game type by itself.
      # Project IDs come from X-Curse-Project-ID and X-Wago-ID in MonkeDo.toc.
      - name: Package and upload
        uses: BigWigsMods/packager@v2
