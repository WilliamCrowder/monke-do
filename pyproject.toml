[project]
name = "monke-do-pipeline"
version = "0.1.0"
description = "Offline pipeline that builds MonkeDB.lua for the Monke Do addon"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["anthropic>=1.7"]  # output_config structured outputs need a current SDK

[dependency-groups]
dev = [
    "pytest>=8",
    "lupa>=2.4",   # Lua 5.1 runtime for tests/lua/run_specs.py, no Lua toolchain needed
]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["."]
addopts = "-q"
markers = ["network: needs the internet; never selected by default or in CI"]

[tool.uv]
package = false
